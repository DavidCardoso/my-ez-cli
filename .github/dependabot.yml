version: 2

# Grouping strategy:
# - Minor and patch updates are batched into one PR per ecosystem/directory,
#   so a weekly run produces a handful of PRs instead of one per package.
# - Major updates stay as individual PRs, since each may need migration work.
# - Security updates are batched separately so they are never held behind
#   routine version bumps.
#
# Each Poetry/npm project keeps its own entry so a PR only ever touches one
# lockfile; the Docker base images have no lockfile and share one entry.

updates:
  # Python (Poetry) — AI service
  - package-ecosystem: "pip"
    directory: "/services/ai"
    schedule:
      interval: "weekly"
    target-branch: "main"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]

  # Python (Poetry) — Dashboard service
  - package-ecosystem: "pip"
    directory: "/services/dashboard"
    schedule:
      interval: "weekly"
    target-branch: "main"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]

  # Python (Poetry) — Config service
  - package-ecosystem: "pip"
    directory: "/services/config"
    schedule:
      interval: "weekly"
    target-branch: "main"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]

  # npm — Dashboard frontend (Vue 3)
  - package-ecosystem: "npm"
    directory: "/services/dashboard/frontend"
    schedule:
      interval: "weekly"
    target-branch: "main"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Docker base images — all custom images
  - package-ecosystem: "docker"
    directories:
      - "/docker/ai-service"
      - "/docker/claude"
      - "/docker/config-service"
      - "/docker/dashboard"
      - "/docker/playwright"
      - "/docker/serverless"
      - "/docker/speedtest"
      - "/docker/yarn-berry"
      - "/docker/yarn-plus"
    schedule:
      interval: "weekly"
    target-branch: "main"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
